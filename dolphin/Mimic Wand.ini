# Mimic Wand -> emulated Wii Remote (Dolphin controller profile)
# Mimic motion controller layout:
#   Buttons 0..11 : A B 1 2 - + Home Up Down Left Right Center
#   Axis X/Y/Z    : orientation quaternion x (pitch), y (roll), z (yaw)
#   Axis Rx/Ry/Rz : acceleration incl. gravity, full scale 8 g
# Status: draft, not yet loaded in Dolphin. If Dolphin names the device differently, change
# the Device line to what Controllers > Wii Remote 1 > Configure shows.
[Profile]
Device = DInput/0/Mimic
Buttons/A = `Button 0`
Buttons/B = `Button 1`
Buttons/1 = `Button 2`
Buttons/2 = `Button 3`
Buttons/- = `Button 4`
Buttons/+ = `Button 5`
Buttons/Home = `Button 6`
D-Pad/Up = `Button 7`
D-Pad/Down = `Button 8`
D-Pad/Left = `Button 9`
D-Pad/Right = `Button 10`
IR/Up = `Axis X+`
IR/Down = `Axis X-`
IR/Left = `Axis Z+`
IR/Right = `Axis Z-`
IR/Recenter = `Button 11`
Tilt/Forward = `Axis X-`
Tilt/Backward = `Axis X+`
Tilt/Left = `Axis Y-`
Tilt/Right = `Axis Y+`
Shake/X = `Axis Rx+` | `Axis Rx-`
Shake/Y = `Axis Ry+` | `Axis Ry-`
Shake/Z = `Axis Rz+` | `Axis Rz-`
Swing/Left = `Axis Rx-`
Swing/Right = `Axis Rx+`
Swing/Forward = `Axis Ry+`
Swing/Backward = `Axis Ry-`
